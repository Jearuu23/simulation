		<!-- modal for change key -->
		<div class="modal" id="changeKeyDialog">
			<h2>Change Key</h2>
			<label for="oldSecretKeyInput">
				<label for="oldSecretKeyInput">Old Key</label>
				<input type="password" id="oldSecretKeyInput" name="oldSecretKeyInput" />
				<label for="newSecretKeyInput">New Key</label>
				<input type="password" id="newSecretKeyInput" name="newSecretKeyInput" />
				<button onclick="changeKey()">Submit</button>
				<button onclick="hideModal()" class="btnCancel">Cancel</button>
			</label>
		</div>

		<!-- modal for key first time -->
		<div class="modal" id="secretKeyPromptModal">
			<label for="secretKeyInput">Enter Decryption Secret Key</label>
			<input type="password" id="secretKeyInput" />
			<button onclick="submitKey()">Submit</button>
		</div>
