<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="userStyle.css" />
		<title>Chat</title>

		<style>
			.modal {
				position: fixed;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				background: #ffffff;
				padding: 2rem;
				border-radius: 0.75rem;
				box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.2);
				z-index: 2;
				width: 320px;
				max-width: 90%;
				font-family: Arial, Helvetica, sans-serif;
			}

			.modal label {
				font-weight: 600;
				font-size: 1.6rem;
				display: block;
				margin-bottom: 0.8rem;
				color: #333;
			}

			.modal input {
				width: 100%;
				padding: 0.7rem;
				font-size: 1.4rem;
				border: 1px solid #ccc;
				border-radius: 0.5rem;
				margin-bottom: 1rem;
				outline: none;
				transition:
					border 0.2s,
					box-shadow 0.2s;
			}

			.modal input:focus {
				border-color: #4a6cff;
				box-shadow: 0 0 0 3px rgba(74, 108, 255, 0.2);
			}

			.modal button {
				margin-top: 0.5rem;
				padding: 0.6rem 1rem;
				font-size: 1.4rem;
				width: 100%;
				background-color: #4a6cff;
				color: #fff;
				border: none;
				border-radius: 0.5rem;
				cursor: pointer;
				transition:
					background 0.2s,
					transform 0.05s;
			}

			.modal button:hover {
				background-color: #6f8bff;
			}

			.modal button:active {
				transform: scale(0.97);
				background-color: #3d57d6;
			}

			.modal .btnCancel {
				background-color: #ff4a6c;
				margin-top: 0.7rem;
			}

			.modal .btnCancel:hover {
				background-color: #ff6f8b;
			}

			.modal .btnCancel:active {
				background-color: #e23c5c;
			}

			.overlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.45);
				backdrop-filter: blur(3px);
				z-index: 1;
			}

			#changeKeyModal {
				display: none;
			}
		</style>
	</head>

	<body>
		<div class="overlay" id="overlay"></div>
		<!-- modal for change key -->
		<div class="modal" id="changeKeyModal">
			<label for="newKey">
				<label for="newKey">Change Key</label>
				<input type="password" id="newKey" name="newKey" />
				<button onclick="changeKey()">Submit</button>
				<button onclick="hideModal()" class="btnCancel">Cancel</button>
			</label>
		</div>

		<!-- modal for decryption secret -->
		<div class="modal" id="decryptionSecretModal">
			<label for="secret">Enter Decryption Secret Key</label>
			<input type="password" id="decryptionSecret" />
			<button onclick="submitKey()">Submit</button>
		</div>

		<!-- chat -->
		<div class="chat">
			<div class="chat-header">
				<h2>Chat Message</h2>
				<button onclick="showChangeKeyModal()">Change Key</button>
			</div>

			<div class="chat-messages" id="messages">

					</svg>
					<div class="message">Hi! This UI looks nice.</div>

			<div class="chat-input">
				<input type="text" id="messageInput" placeholder="Type message..." />
