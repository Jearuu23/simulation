<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Intrusion Detected - Data Breach</title>
		<style>
			:root {
				--bg: #0a0a0a;
				--terminal-green: #00ff41;
				--terminal-dark: #1a1a1a;
				--error-red: #ff3e3e;
				--border: #333;
			}

			body {
				background: var(--bg);
				color: var(--terminal-green);
				font-family: "Courier New", Courier, monospace;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
				margin: 0;
				overflow: hidden;
			}

			.terminal-container {
				width: 90vw;
				height: 85vh;
				background: var(--terminal-dark);
				border: 1px solid var(--border);
				border-radius: 8px;
				display: flex;
				flex-direction: column;
				box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
			}

			.terminal-header {
				background: #222;
				padding: 10px;
				border-bottom: 1px solid var(--border);
				display: flex;
				justify-content: space-between;
				font-size: 0.8rem;
			}

			.status-pulse {
				display: inline-block;
				width: 10px;
				height: 10px;
				background: var(--terminal-green);
				border-radius: 50%;
				animation: pulse 1s infinite;
			}

			@keyframes pulse {
				0% {
					opacity: 1;
				}
				50% {
					opacity: 0.3;
				}
				100% {
					opacity: 1;
				}
			}

			#log-output {
				flex: 1;
				padding: 20px;
				overflow-y: auto;
				font-size: 0.9rem;
				line-height: 1.5;
			}

			.entry {
				margin-bottom: 1.5rem;
				border-left: 2px solid var(--border);
				padding-left: 10px;
			}

			.raw-data {
				color: #888;
				word-break: break-all;
				background: #111;
				padding: 10px;
				display: block;
				margin-top: 5px;
				border: 1px dashed #444;
			}

			.failure-label {
				color: var(--error-red);
				font-weight: bold;
			}

			.timestamp {
				color: #555;
			}
		</style>
	</head>
	<body>
		<div class="terminal-container">
			<div class="terminal-header">
				<span>PACKET_SNIFFER_v4.2</span>
				<span>STATUS: <span class="status-pulse"></span> INTERCEPTING...</span>
			</div>
			<div id="log-output">
				[SYSTEM] Initializing intercept on http://localhost:3000/message...<br />
				[SYSTEM] Listening for data packets...<br /><br />
			</div>
		</div>

		<script>
			const logOutput = document.getElementById("log-output");

			async function startIntercept() {
				try {
					const res = await fetch("http://localhost:3000/message");
					const data = await res.json();

					if (data.messages && data.messages.length > 0) {
						renderInterceptedData(data.messages);
					} else {
						logOutput.innerHTML += `<div class="entry">[INFO] Server response empty. No messages found.</div>`;
					}
				} catch (error) {
					logOutput.innerHTML += `<div class="entry" style="color:red">[ERROR] Failed to connect to server: ${error.message}</div>`;
				}
			}

			function renderInterceptedData(messages) {
				logOutput.innerHTML = `<div class="entry">[SYSTEM] Intercepted ${messages.length} data packets.</div>`;
				messages.forEach((msg, index) => {
					const entry = document.createElement("div");
					entry.className = "entry";
					entry.innerHTML = `
                    <div><span class="timestamp">[${new Date().toLocaleTimeString()}]</span> PACKET #${index + 1} INTERCEPTED</div>
                    <div>SOURCE_ID: UNKNOWN (ENCRYPTED)</div>
                    <div>AUTHENTICATION_TAG: <span class="failure-label">MISSING_KEY</span></div>
                    <div>DATA_PAYLOAD:</div>
                    <code class="raw-data">
                        {
                            "iv": "${msg.iv}",
                            "ciphertext": "${msg.ciphertext}"
                        }
                    </code>
                    <div class="failure-label">>> DECRYPTION_FAILED: AES-GCM Key Required</div>
                `;
					logOutput.appendChild(entry);
				});
				logOutput.scrollTop = logOutput.scrollHeight;
			}

			startIntercept();
			// setInterval(startIntercept, 5000);
		</script>
	</body>
</html>
